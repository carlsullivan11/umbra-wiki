name: import-cwe
on:
  workflow_dispatch:
  schedule:
    # CWE ships a few releases a year (v4.20 is dated 2026-04-30), so monthly
    # is ample. Offset from the ATT&CK job on the 1st.
    - cron: "40 5 2 * *"
jobs:
  cwe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test importer
        run: python -m pytest scripts/tests -q

      - name: Import CWE
        run: python scripts/importers/import_cwe.py --out imports/mitre-cwe

      - name: Validate
        run: python scripts/validate_corpus.py

      - name: Commit
        run: |
          git config user.name "umbra-wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imports/mitre-cwe meta/attribution/mitre-cwe.md || true
          git diff --staged --quiet || git commit -m "chore(import): refresh MITRE CWE catalogue"
          git push || true
