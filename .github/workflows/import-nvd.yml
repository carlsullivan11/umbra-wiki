name: import-nvd
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look back N days by lastModified"
        default: "7"
      limit:
        description: "Hard cap on pages written"
        default: "200"
  schedule:
    # Offset from import-kev (06:30) so the two never race on the same push.
    - cron: "45 7 * * *"
jobs:
  nvd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fixture-based tests first: never publish from a broken importer.
      - name: Test importer
        run: python -m pytest scripts/tests -q

      - name: Import NVD (incremental, capped)
        env:
          # Optional; raises the rate limit 5→50 req/30s. Works without it.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python scripts/importers/import_nvd.py \
            --out imports/nvd-cve \
            --days "${{ github.event.inputs.days || 7 }}" \
            --limit "${{ github.event.inputs.limit || 200 }}"

      - name: Validate
        run: python scripts/validate_corpus.py

      - name: Commit
        run: |
          git config user.name "umbra-wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imports/nvd-cve meta/attribution/nvd-cve.md || true
          git diff --staged --quiet || git commit -m "chore(import): refresh NVD CVE window"
          git push || true
