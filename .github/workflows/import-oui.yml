name: import-oui
on:
  workflow_dispatch:
  schedule:
    # IEEE updates registrations continuously but slowly; weekly is ample and
    # keeps the 2 MB CSV diff small. Offset from the CVE importers.
    - cron: "10 4 * * 0"
jobs:
  oui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test importer
        run: python -m pytest scripts/tests -q

      - name: Import IEEE OUI registries
        run: python scripts/importers/import_oui.py --out imports/ieee-oui/data

      - name: Validate
        run: python scripts/validate_corpus.py

      - name: Commit
        run: |
          git config user.name "umbra-wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imports/ieee-oui meta/attribution/ieee-oui.md || true
          git diff --staged --quiet || git commit -m "chore(import): refresh IEEE OUI registries"
          git push || true
