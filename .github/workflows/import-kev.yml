name: import-kev
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
jobs:
  kev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import KEV
        run: python scripts/importers/import_kev.py --out imports/cisa-kev
      - name: Validate
        run: python scripts/validate_corpus.py
      - name: Commit
        run: |
          git config user.name "umbra-wiki-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imports/cisa-kev meta/attribution/cisa-kev.md || true
          git diff --staged --quiet || git commit -m "chore(import): refresh CISA KEV"
          git push || true
